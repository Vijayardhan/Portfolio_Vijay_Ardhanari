<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Section</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/skills.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mq/mq-skills.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
</head>
<body>
    <section id="skills">
        <div class="skills-header">
            <h1 class="section-title">My Skills</h1>
            <div class="title-underline"></div>
        </div>

        <div class="skills-columns-container">
            <!-- Tech & Tools Column -->
            <div class="skills-column tech-column">
                <h2 class="column-title">Tech & Tools</h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/21wvsc5d/images.png" alt="IoT">
                        </div>
                        <span class="skill-name">Embedded Systems</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/TYpt4LC/microchip.png" alt="Microcontrollers">
                        </div>
                        <span class="skill-name">Microcontrollers</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/B5TFZ14X/circuit-board.png" alt="Automation">
                        </div>
                        <span class="skill-name">Electronics</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/HDHTRkFL/electricity.png" alt="Electrical Testing">
                        </div>
                        <span class="skill-name">Electrical Testing</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/j9cdCNKF/motherboard-1.png" alt="Python">
                        </div>
                        <span class="skill-name">Hardware Validation</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/n8mqLHMn/prototype.png" alt="C">
                        </div>
                        <span class="skill-name">Prototyping</span>
                    </div>
                </div>
            </div>

            <!-- Others & Hobbies Column -->
            <div class="skills-column hobbies-column">
                <h2 class="column-title"></h2>
                <div class="skills-grid">
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/3mSDvsSn/download.png" alt="HTML">
                        </div>
                        <span class="skill-name">Labview</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/LDcSjrp6/download.jpg" alt="CSS">
                        </div>
                        <span class="skill-name">STM32CubeMX</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/pvLmD8N/letter-c.png" alt="JavaScript">
                        </div>
                        <span class="skill-name">Embedded C</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/8Drx1Lb/python.png" alt="Flask">
                        </div>
                        <span class="skill-name">Python</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/nNCj2cTC/org-kicad-Ki-Cad.webp" alt="Canva">
                        </div>
                        <span class="skill-name">Kicad</span>
                    </div>
                    <div class="skill-item">
                        <div class="skill-icon">
                            <img src="https://i.ibb.co/JR7GwmsH/Matlab-Logo.png" alt="Excel">
                        </div>
                        <span class="skill-name">Matlab</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/skills.js') }}"></script>
</body>
</html>
