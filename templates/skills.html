<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills Section</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/skills.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mq/mq-skills.css') }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
</head>

<body>
    <section id="skills">
        <div class="skills-header">
            <h1 class="section-title">My Skills</h1>
            <div class="title-underline"></div>
        </div>

        <div class="skills-columns-container">

            <!-- Tech Stack Column -->
            <div class="skills-column tech-column">
                <h2 class="column-title">Tech Stack</h2>

                <div class="skills-grid">

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://api.iconify.design/mdi/integrated-circuit-chip.svg?color=%2300bcd4"
                                alt="Embedded Systems"
                            >
                        </div>
                        <span class="skill-name">Embedded Systems</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://api.iconify.design/mdi/battery-charging-high.svg?color=%23f4c430"
                                alt="Battery Testing and BMS Validation"
                            >
                        </div>
                        <span class="skill-name">
                            Battery Testing<br>
                            &amp; BMS Validation
                        </span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://api.iconify.design/mdi/lan-connect.svg?color=%2300bcd4"
                                alt="CAN Communication"
                            >
                        </div>
                        <span class="skill-name">CAN Communication</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://api.iconify.design/mdi/memory.svg?color=%2300bcd4"
                                alt="Microcontrollers"
                            >
                        </div>
                        <span class="skill-name">Microcontrollers</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://i.ibb.co/j9cdCNKF/motherboard-1.png"
                                alt="Hardware Validation"
                            >
                        </div>
                        <span class="skill-name">Hardware Validation</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://api.iconify.design/mdi/soldering-iron.svg?color=%2300bcd4"
                                alt="Electronics Prototyping"
                            >
                        </div>
                        <span class="skill-name">Electronics Prototyping</span>
                    </div>

                </div>
            </div>

            <!-- Tools Column -->
            <div class="skills-column hobbies-column">
                <h2 class="column-title">Tools</h2>

                <div class="skills-grid">

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.simpleicons.org/stmicroelectronics/03A9F4"
                                alt="STM32CubeIDE"
                            >
                        </div>
                        <span class="skill-name">STM32CubeIDE</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg"
                                alt="Python"
                            >
                        </div>
                        <span class="skill-name">Python</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/matlab/matlab-original.svg"
                                alt="MATLAB"
                            >
                        </div>
                        <span class="skill-name">MATLAB</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/c/c-original.svg"
                                alt="Embedded C"
                            >
                        </div>
                        <span class="skill-name">Embedded C</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg"
                                alt="Visual Studio Code"
                            >
                        </div>
                        <span class="skill-name">VS Code</span>
                    </div>

                    <div class="skill-item">
                        <div class="skill-icon">
                            <img
                                src="https://cdn.simpleicons.org/github/FFFFFF"
                                alt="Git and GitHub"
                            >
                        </div>
                        <span class="skill-name">Git/GitHub</span>
                    </div>

                </div>
            </div>

        </div>
    </section>

    <script src="{{ url_for('static', filename='js/skills.js') }}"></script>
</body>
</html>
